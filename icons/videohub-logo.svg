<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 120 24"
     preserveAspectRatio="xMidYMid meet"
     focusable="false"
     style="pointer-events: none; display: block; width: 100%; height: 100%;">

    <!-- VideoHub play button -->
    <rect x="1" y="3" width="30" height="18" rx="5" fill="#FF0000"/>

    <!-- Play icon -->
    <polygon points="13,7 13,17 22,12" fill="white"/>

    <!-- VideoHub text -->
    <text x="37"
          y="17"
          font-family="Arial, Helvetica, sans-serif"
          font-size="15"
          font-weight="700"
          fill="currentColor">
        VideoHub
    </text>

</svg>
